[package]
name = "librewxr-native"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Optional native weather sampling and radar rendering kernels for LibreWXR"

[lib]
name = "_librewxr_native"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.23"
png = "0.17"
pyo3 = { version = "0.23", features = ["abi3-py311", "extension-module"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
