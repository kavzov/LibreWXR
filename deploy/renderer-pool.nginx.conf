worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
  worker_connections 8192;
}

http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  access_log off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  upstream renderers {
    zone renderers 64k;
    least_conn;
    server renderer:8080 resolve;
    server renderer-secondary:8080 resolve;
    keepalive 128;
  }

  server {
    listen 8080;
    server_name _;

    location = /pool-healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    location / {
      proxy_pass http://renderers;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_connect_timeout 2s;
      proxy_read_timeout 45s;
      proxy_send_timeout 45s;
      # Tile requests are idempotent.  Retry one failed/reset renderer on the
      # other pool member instead of exposing a transient 502/503/504.
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }
  }
}
